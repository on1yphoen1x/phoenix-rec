name = "flint-share"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "flint.men/clip*", zone_name = "flint.men" }
]

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "flint"

# Secret, set with `npx wrangler secret put UPLOAD_TOKEN`: a long random string,
# also pasted into Flint's Settings > Sharing.
